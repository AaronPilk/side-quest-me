# Reduced from `supabase init` generated by CLI 2.101.0.
# Local project label, not a hosted Supabase project reference.
project_id = "sidequest"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
# This repository uses versioned migrations, not declarative schema files.
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "http://localhost:5173/auth/callback", "http://127.0.0.1:5279/auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false

[storage]
# Application videos live only in private R2, never Supabase Storage.
enabled = false

[realtime]
enabled = false
